<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <link rel="icon" href="data:," />
    <meta
      name="description"
      content="HoloHangout — shared mixed-reality Twitch communities"
    />
    <title>HoloHangout — Shared Live Experiences</title>
    <style>
      html, body { width: 100%; min-height: 100%; margin: 0; }
      body[data-mode="world"] { height: 100%; overflow: hidden; }
      #scene-container { display: none; width: 100%; height: 100%; }
      body[data-mode="world"] #scene-container { display: block; }
      #site-root { min-height: 100vh; }
      body[data-mode="world"] #site-root { display: none; }
      #connection-status {
        display: none;
        position: fixed;
        left: 16px;
        bottom: 16px;
        z-index: 20;
        max-width: min(460px, calc(100vw - 32px));
        box-sizing: border-box;
        padding: 9px 13px;
        border: 1px solid rgba(255,255,255,.22);
        border-radius: 999px;
        background: rgba(6,20,24,.84);
        color: #fff;
        font: 600 13px/1.3 system-ui, sans-serif;
        backdrop-filter: blur(10px);
        pointer-events: none;
      }
      body[data-mode="world"] #connection-status { display: block; }
      #connection-status[data-state="ready"] { border-color: #2ed7c4; }
      #connection-status[data-state="waiting"] { border-color: #ffc76c; }
      @media (display-mode: standalone) { #connection-status { bottom: 24px; } }
    </style>
  </head>
  <body>
    <main id="site-root"></main>
    <div id="scene-container"></div>
    <div id="connection-status" data-state="offline" role="status" aria-live="polite">
      Connecting to HoloHangout backend…
    </div>
    <script type="module" src="/src/entry.ts"></script>
  </body>
</html>
