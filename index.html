<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <link rel="icon" href="data:," />
    <meta
      name="description"
      content="HoloHangout — Twitch viewers become interactive mixed-reality characters"
    />
    <title>HoloHangout World</title>
    <style>
      html, body, #scene-container { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      #connection-status {
        position: fixed;
        left: 16px;
        bottom: 16px;
        z-index: 20;
        max-width: min(460px, calc(100vw - 32px));
        box-sizing: border-box;
        padding: 9px 13px;
        border: 1px solid rgba(255,255,255,.22);
        border-radius: 999px;
        background: rgba(6,20,24,.84);
        color: #fff;
        font: 600 13px/1.3 system-ui, sans-serif;
        backdrop-filter: blur(10px);
        pointer-events: none;
      }
      #connection-status[data-state="ready"] { border-color: #2ed7c4; }
      #connection-status[data-state="waiting"] { border-color: #ffc76c; }
      #landing-brand {
        position: fixed;
        top: clamp(24px, 8vh, 76px);
        left: 50%;
        z-index: 10;
        width: min(620px, 72vw);
        transform: translateX(-50%);
        pointer-events: none;
      }
      #landing-brand img {
        display: block;
        width: 100%;
        height: auto;
        filter: drop-shadow(0 14px 30px rgba(21, 4, 45, .32));
      }
      @media (display-mode: standalone) { #connection-status { bottom: 24px; } }
      @media (max-width: 640px) {
        #landing-brand { top: 22px; width: min(460px, 82vw); }
      }
    </style>
  </head>
  <body>
    <div id="scene-container"></div>
    <div id="landing-brand" aria-hidden="true">
      <img src="/holohangout-logo.png" alt="" />
    </div>
    <div id="connection-status" data-state="offline" role="status" aria-live="polite">
      Connecting to HoloHangout…
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
