services:
  - type: web
    name: holohangout-platform
    runtime: node
    buildCommand: npm ci
    startCommand: npm run server:platform
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 22.19.0
      - key: HOLOHANGOUT_PUBLIC_URL
        sync: false
      - key: HOLOHANGOUT_FRONTEND_ORIGIN
        sync: false
      - key: TWITCH_REDIRECT_URI
        sync: false
      - key: TWITCH_CLIENT_ID
        sync: false
      - key: TWITCH_CLIENT_SECRET
        sync: false
      - key: HOLOHANGOUT_SESSION_SECRET
        generateValue: true
      - key: HOLOHANGOUT_TOKEN_KEY
        generateValue: true
      - key: TWITCH_EVENTSUB_SECRET
        generateValue: true
      - key: HOLOHANGOUT_DATA_DIR
        value: /var/data/holohangout
    disk:
      name: holohangout-data
      mountPath: /var/data
      sizeGB: 1
